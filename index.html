<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAISE SHOP - Online Shop</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
body { background:#f8f8f8; color:#222; }
header { background:#111; color:white; padding:20px; display:flex; justify-content:space-between; align-items:center; }
header h1 { font-size:24px; letter-spacing:2px; }
header h1 span { color:#ff3b6b; }
nav a { color:white; text-decoration:none; margin-left:15px; font-size:14px; }
.hero { background:linear-gradient(135deg,#ff3b6b,#ff8a00); color:white; text-align:center; padding:60px 20px; }
.hero h2 { font-size:36px; margin-bottom:10px; }
.hero p { margin-bottom:20px; }
.hero a { background:white; color:#ff3b6b; padding:12px 25px; border-radius:25px; text-decoration:none; font-weight:bold; }
.products { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; padding:30px 15px; }
.card { background:white; width:160px; border-radius:15px; overflow:hidden; text-align:center; box-shadow:0 4px 10px rgba(0,0,0,0.1); padding-bottom:15px; }
.card img { width:100%; height:120px; object-fit:cover; }
.card h3 { margin:10px 0 5px; font-size:16px; }
.card p { color:#ff3b6b; font-weight:bold; }
.card button { margin-top:10px; background:#111; color:white; border:none; padding:8px 15px; border-radius:20px; }
footer { background:#111; color:white; text-align:center; padding:20px; font-size:13px; }
</style>
</head>
<body>

<header>
<h1>DAISE <span>SHOP</span></h1>
<nav><a href="#">Home</a><a href="#">Shop</a><a href="#">Contact</a></nav>
</header>

<div class="hero">
<h2>New Collection 2026 🔥</h2>
<p>Best prices - Fast delivery in Morocco</p>
<a href="#">Shop Now</a>
</div>

<div class="products">
<div class="card"><img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"><h3>Smart Watch</h3><p>299 DH</p><button>Add to Cart</button></div>
<div class="card"><img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"><h3>Sneakers</h3><p>349 DH</p><button>Add to Cart</button></div>
<div class="card"><img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=400"><h3>Camera</h3><p>899 DH</p><button>Add to Cart</button></div>
<div class="card"><img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad?w=400"><h3>Perfume</h3><p>199 DH</p><button>Add to Cart</button></div>
</div>

<footer>© 2026 DAISE SHOP - Made by Redwane | Rabat, Morocco</footer>

</body>
</html>
